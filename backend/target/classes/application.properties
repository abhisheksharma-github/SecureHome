server.port=8080
spring.application.name=SecureHome

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_URL}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

securehome.jwt.secret=5A7134743777217A25432A462D4A614E645267556B58703272357538782F413F4A566E5972337336763979244226452848624D6251655468576D5A7134743677397A
securehome.jwt.expiration-ms=86400000

securehome.websocket.allowed-origins=${ALLOWED_ORIGINS}
securehome.cors.allowed-origins=${ALLOWED_ORIGINS}

logging.level.com.securehome=DEBUG
logging.level.org.springframework.security=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
