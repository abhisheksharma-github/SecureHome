server.port=${PORT:8080}
spring.application.name=SecureHome

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never

securehome.jwt.secret=${JWT_SECRET}
securehome.jwt.expiration-ms=86400000

securehome.websocket.allowed-origins=${ALLOWED_ORIGINS}
securehome.cors.allowed-origins=${ALLOWED_ORIGINS}

logging.level.com.securehome=INFO
logging.level.org.springframework.security=WARN

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC